<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watson's Timeline: Silver Blaze</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="stylesheet" href="ui/world.css">
</head>
<body class="world-page">
<header class="top">
  <h1><span class="case-title">Silver Blaze</span> <span class="subtitle">Watson's timeline (a draft)</span></h1>
  <div class="controls">
    <span class="reading-at">
      <button type="button" id="back" class="quiet" title="Back one paragraph">◀</button>
      <label>Read to ¶<input type="number" id="para" min="1" size="4"></label>
      <button type="button" id="next" title="Read the next paragraph">Read on ▶</button>
    </span>
    <label title="Facts whose best chain you trust at least this far are on the timeline.">On the timeline from
      <select id="threshold"></select>
    </label>
    <label title="Show the facts below the threshold too, faded."><input type="checkbox" id="show-below"> show the rest</label>
    <button type="button" id="reset" class="quiet" title="Every link back to uncertain">Reset trust</button>
    <a href="./" class="small">The game</a>
  </div>
</header>
<main class="world-main">
  <section class="world-story" aria-label="The story so far"><h2>The story</h2><div id="story"></div></section>
  <section class="world-timeline" aria-label="The timeline">
    <div id="clashes"></div>
    <h2>The timeline</h2>
    <div id="timeline"><p class="muted">Reading the case…</p></div>
  </section>
  <aside class="world-detail" id="detail" aria-label="Details"><p class="muted">Click an event for where it comes from, or a name for its own timeline.</p></aside>
</main>
<script type="module" src="ui/world.js"></script>
</body>
</html>
