<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook: Silver Blaze</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<header class="top">
  <h1><span class="case-title">Silver Blaze</span> <span class="subtitle">a casebook</span></h1>
  <div class="controls">
    <span id="progress" class="progress"></span>
    <details class="settings">
      <summary title="Game settings"><span class="gear" aria-hidden="true">⚙</span> <span id="settings-summary" class="long">Settings</span><span id="settings-short" class="short">Settings</span></summary>
      <div class="settings-panel">
      <label title="Trivial: the game works out what your clues allow and settles each question itself; you read and watch. Easy: every answer listed, the ones your clues rule out are greyed; cross out freely. Medium: every answer listed; you must cite the evidence that rules each one out. Hard: cards are collected only by clicking the text; you propose the answers yourself, then rule them out with evidence.">
        Difficulty
        <select id="difficulty"><option value="trivial">Trivial</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
      </label>
      <label title="Free: read on whenever you like. Wait for deductions: when Holmes acts on a deduction, the story waits until you have made it too.">
        Pace
        <select id="pace"><option value="free">Free</option><option value="wait">Wait for deductions</option></select>
      </label>
      <label id="autopace-label" title="Trivial only. Keep pace with Holmes: an answer settles when Holmes reaches it in the story. As soon as the clues allow: an answer settles the moment the clues you hold decide it, which can be long before Holmes says so.">
        Trivial answers
        <select id="autopace"><option value="holmes">Keep pace with Holmes</option><option value="logic">As soon as the clues allow</option></select>
      </label>
      <label title="Background facts (general knowledge a reader of the time had). All at once: a reference book from the start. When relevant: each appears where the story first touches its subject. When asked: open a card and ask what you know about it.">
        Background
        <select id="background"><option value="start">All at once</option><option value="relevant">When relevant</option><option value="ask">When asked</option></select>
      </label>
      </div>
    </details>
    <button id="reset" class="quiet">Start over</button>
  </div>
</header>
<main class="layout">
  <section class="story-pane">
    <div id="story" class="story"></div>
    <div id="reader" class="reader"></div>
  </section>
  <section class="tools">
    <div class="tabs" role="tablist">
      <button data-tab="card" class="tab on">Card</button>
      <button data-tab="cards" class="tab">Cards</button>
      <button data-tab="questions" class="tab">Questions</button>
      <button data-tab="theories" class="tab">Theories</button>
      <button data-tab="timeline" class="tab">Timeline</button>
      <button data-tab="background" class="tab">Background</button>
    </div>
    <div id="tool" class="tool-body"></div>
  </section>
</main>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>
<dialog id="cite">
  <form method="dialog" class="cite">
    <h2 id="cite-title"></h2>
    <p id="cite-help" class="muted"></p>
    <div id="cite-chosen" class="chips"></div>
    <input id="cite-search" type="search" placeholder="Search your clues and background notes…" autocomplete="off">
    <div id="cite-list" class="cite-list"></div>
    <p id="cite-result" class="result"></p>
    <div class="row">
      <button id="cite-check" value="check" type="button">Check</button>
      <button value="close" class="quiet">Close</button>
    </div>
  </form>
</dialog>
<script type="module" src="ui/app.js"></script>
</body>
</html>
