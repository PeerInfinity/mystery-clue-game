<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook: Silver Blaze</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<header class="top">
  <h1><span class="case-title">Silver Blaze</span> <span class="subtitle">a casebook</span></h1>
  <div class="controls">
    <span id="progress" class="progress"></span>
    <span class="columns" title="Show one panel the full width, or two side by side"><button data-cols="2" class="quiet">Two columns</button><button data-cols="1" class="quiet">One column</button></span>
    <details class="settings">
      <summary title="Game settings"><span class="gear" aria-hidden="true">⚙</span> <span id="settings-summary" class="long">Settings</span><span id="settings-short" class="short">Settings</span></summary>
      <div class="settings-panel">
      <label title="Each difficulty is a preset of the options below. Change any option and the difficulty reads Custom.">
        Difficulty
        <select id="difficulty"><option value="trivial">Trivial</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="custom" disabled>Custom</option></select>
      </label>
      <label title="Free: read on whenever you like. Wait for deductions: when Holmes acts on a deduction, the story waits until you have made it too.">
        Pace
        <select id="pace"><option value="free">Free</option><option value="wait">Wait for deductions</option></select>
      </label>
      <label id="autopace-label" title="When the game works out the answers. Keep pace with Holmes: an answer settles when Holmes reaches it in the story. As soon as the clues allow: an answer settles the moment the clues you hold decide it, which can be long before Holmes says so.">
        The game settles answers
        <select id="autopace"><option value="holmes">Keeping pace with Holmes</option><option value="logic">As soon as the clues allow</option></select>
      </label>
      <details class="difficulty-options" id="difficulty-options">
        <summary>Difficulty options</summary>
        <div id="options" class="options-grid"></div>
      </details>
      </div>
    </details>
    <button id="reset" class="quiet">Start over</button>
  </div>
</header>
<div id="reader" class="reader"></div>
<main class="layout">
  <section class="panel" data-panel="0">
    <div class="tabs" role="tablist"></div>
    <div class="back-row small" hidden></div>
    <div id="panel-0" class="panel-body"><p class="muted">Loading the case…</p></div>
  </section>
  <section class="panel" data-panel="1">
    <div class="tabs" role="tablist"></div>
    <div class="back-row small" hidden></div>
    <div id="panel-1" class="panel-body"></div>
  </section>
</main>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div class="busy-box"><div>Working it out…</div><div class="busy-track"><div id="busy-bar" class="busy-bar"></div></div><div id="busy-detail" class="small muted"></div></div></div>
<script type="module" src="ui/app.js"></script>
</body>
</html>
